<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerra de Hortifrúti: 1v1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Guerra de Hortifrúti 🍅 Broccoli Strike</h1>

    <div id="instrucoes">

            <strong style="color: #2ecc71;">Jogador 1 (Verde):</strong> <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> | Atirar: <span class="key">ESPAÇO</span>

        </div>
    </div>
